<!-- Unified tracking: FT/LT + UTM capture + lead_reference + form fill + honeypot -->
<script>
(function(){
  var UTM_KEYS=["utm_source","utm_medium","utm_campaign","utm_term","utm_content","gclid","fbclid","li_fat_id"];
  var path=window.location.pathname, url=window.location.href;
  var excluded=["/book-a-demo","/book-a-demo-va","/thank-you","/thank-you-page","/free-trial"];
  var now=Date.now();
 
  /* --- lead_reference (90-day cookie, shared across .aiaccountant.com) --- */
  function getLeadRef(){
    var m=document.cookie.match(/(?:^|;\s*)lead_reference=([^;]+)/);
    var id=m?m[1]:null;
    if(!id){
      id=(window.crypto&&crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now()+"-"+Math.random().toString(36).slice(2);
    }
    document.cookie="lead_reference="+id+
      "; domain=.aiaccountant.com; path=/; max-age=7776000; SameSite=Lax; Secure";
    window.LEAD_REFERENCE=id;
    return id;
  }
  getLeadRef();
 
  /* --- FT (30-day localStorage) --- */
  var sFT=localStorage.getItem("ft_landing_page"),sFTT=localStorage.getItem("ft_timestamp");
  if(!sFT||!sFTT||(now-parseInt(sFTT,10))/864e5>30){
    localStorage.setItem("ft_landing_page",url);
    localStorage.setItem("ft_timestamp",now);
  }
 
  /* --- LT (session) --- */
  var lastNE=sessionStorage.getItem("last_non_excluded_page");
  if(!excluded.includes(path)){
    sessionStorage.setItem("last_non_excluded_page",url);
  } else if(lastNE){
    sessionStorage.setItem("lt_page",lastNE);
  }
 
  /* --- UTM capture --- */
  var params=new URLSearchParams(window.location.search),utms={};
  UTM_KEYS.forEach(function(k){var v=params.get(k);if(v)utms[k]=v});
  if(Object.keys(utms).length){
    try{var stored=JSON.parse(localStorage.getItem("aia_utms")||"{}");
    localStorage.setItem("aia_utms",JSON.stringify(Object.assign(stored,utms)))}catch(e){}
  }
 
  /* --- Form fill (single pass + before submit) --- */
  function fillForms(){
    var ft=localStorage.getItem("ft_landing_page")||"";
    var lt=sessionStorage.getItem("lt_page")||"";
    var lr=(document.cookie.match(/(?:^|;\s*)lead_reference=([^;]+)/)||[])[1]||window.LEAD_REFERENCE||"";
    var u={};try{u=JSON.parse(localStorage.getItem("aia_utms")||"{}")}catch(e){}
    document.querySelectorAll("form").forEach(function(form){
      var f1=form.querySelector("[name='ft_landing_page']");if(f1)f1.value=ft;
      var f2=form.querySelector("[name='lt_page']");if(f2)f2.value=lt;
      var f3=form.querySelector("[name='lead_reference']");if(f3)f3.value=lr;
      Object.keys(u).forEach(function(k){
        var el=form.querySelector("[name='"+k+"']")||form.querySelector("#"+k);
        if(el&&!el.value)el.value=u[k];
      });
    });
  }
 
  document.addEventListener("DOMContentLoaded",fillForms);
 
  /* --- Submit: honeypot check + last-chance form fill --- */
  document.addEventListener("submit",function(e){
    var form=e.target;if(!form||form.tagName!=="FORM")return;
    var hp=form.querySelector("input[name='company_website']");
    if(hp&&hp.value.length>0){e.preventDefault();e.stopImmediatePropagation();return false}
    fillForms();
  },true);
})();
</script>

<script>
(function () {
  var WAITLIST_URL = 'https://lp.aiaccountant.com/whatsapp-bot-aiaccountant';
  var ARM_DELAY = 2000;
 
  var DEBUG = location.search.indexOf('wadebug=1') !== -1;
  function log() { if (DEBUG) console.log.apply(console, ['[wa]'].concat([].slice.call(arguments))); }
 
  var excludedExact = ['/book-a-demo', '/book-a-demo-va','/thank-you','/thank-you-page'];
  var excludedPrefix = ['/gads', '/meta'];
  var path = window.location.pathname.replace(/\/$/, '').toLowerCase();
 
  if (excludedExact.indexOf(path) !== -1) { log('blocked: excluded page'); return; }
  for (var i = 0; i < excludedPrefix.length; i++) {
    if (path === excludedPrefix[i] || path.indexOf(excludedPrefix[i] + '/') === 0) {
      log('blocked: excluded folder'); return;
    }
  }
 
  var testing = location.search.indexOf('watest=1') !== -1 || DEBUG;
  if (!testing) {
    if (sessionStorage.getItem('waExitShown')) { log('blocked: already shown this session'); return; }
    if (localStorage.getItem('waExitConverted')) { log('blocked: converted'); return; }
  }
 
  var fired = false, armed = false;
  setTimeout(function () { armed = true; log('ARMED'); }, testing ? 0 : ARM_DELAY);
  log('running. testing =', testing, '| path =', path);
 
  function build() {
    var ov = document.createElement('div');
    ov.id = 'wa-exit-overlay';
    ov.innerHTML =
      '<div id="wa-exit-modal" role="dialog" aria-modal="true" aria-label="WhatsApp waitlist">' +
        '<button class="wa-x" aria-label="Close">&times;</button>' +
        '<div class="wa-icon-wrap">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="#25D366" xmlns="http://www.w3.org/2000/svg"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4l.9 2.1c.1.2.1.4 0 .6l-.4.6c-.1.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1.1 2.2 1.4 2.5 1.5.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.4Z"/></svg>' +
        '</div>' +
        '<h3>Talk to your Tally via WhatsApp.</h3>' +
        '<div class="wa-gap"></div>' +
        '<span class="wa-scarcity"><span class="wa-pulse"></span>Free forever for the first 100 users</span>' +
        '<a class="wa-modal-cta" href="' + WAITLIST_URL + '">Get Started</a>' +
        '<button class="wa-dismiss">No thanks, maybe later</button>' +
      '</div>';
    return ov;
  }
 
  function close(ov) {
    ov.classList.remove('wa-show');
    setTimeout(function () { ov.remove(); }, 260);
  }
 
  function show(reason) {
    if (fired) return;
    if (!armed) { log('suppressed, not armed:', reason); return; }
    fired = true;
    log('FIRING via', reason);
    if (!testing) sessionStorage.setItem('waExitShown', '1');
 
    var ov = build();
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('wa-show'); });
 
    ov.querySelector('.wa-x').addEventListener('click', function () { close(ov); });
    ov.querySelector('.wa-dismiss').addEventListener('click', function () { close(ov); });
    ov.addEventListener('click', function (e) { if (e.target === ov) close(ov); });
    ov.querySelector('.wa-modal-cta').addEventListener('click', function () {
      localStorage.setItem('waExitConverted', '1');
    });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { close(ov); document.removeEventListener('keydown', esc); }
    });
  }
 
  window.wa_test = function () { fired = false; armed = true; show('manual'); };
 
  /* ---- LAYER 1: predictive upward velocity ---- */
  var lastY = null, lastT = 0;
  document.addEventListener('mousemove', function (e) {
    if (fired || !armed) return;
    var now = Date.now();
    if (lastY !== null && now - lastT < 120) {
      var speed = (e.clientY - lastY) / ((now - lastT) || 1);
      if (speed < -0.55 && e.clientY < 220) { show('velocity'); return; }
      if (speed < -0.2 && e.clientY < 90)  { show('velocity-near-top'); return; }
    }
    lastY = e.clientY; lastT = now;
  });
 
  /* ---- LAYER 2: crossed the top edge ---- */
  document.addEventListener('mouseout', function (e) {
    if (e.relatedTarget || e.toElement) return;
    if (e.clientY > 40) return;
    show('top-edge');
  });
 
  /* ---- LAYER 3: top-corner sweep (X / traffic lights) ---- */
  document.addEventListener('mousemove', function (e) {
    if (fired || !armed) return;
    if (e.clientY > 60) return;
    if (e.clientX > window.innerWidth - 140 || e.clientX < 140) show('corner');
  });
 
  /* LAYER 4 (visibilitychange) removed: it fired while the tab was hidden,
     rendering the card to nobody and burning the once-per-session lock. */
 
  /* ---- mobile: back-button intercept ---- */
  if (window.matchMedia('(max-width: 700px)').matches) {
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function () {
      if (!fired && armed) {
        history.pushState(null, '', location.href);
        show('mobile-back');
      }
    });
  }
})();
</script>

<!-- Blog index design (v2). Restyles the existing blog list page: hero band, search, post cards, pagination. No text, link or post order is changed. Remove this whole block to go back. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style data-blog-index-v2>
/* 1. Hero band: black, blue glow top right, faint grid. The navbar floats over it. */
.hero-section-3 { --bi-font: 'Helvetica Neue', Inter, Helvetica, Arial, sans-serif; position: relative; isolation: isolate; overflow: hidden; display: block; padding: 136px 0 104px; background-color: #000; background-image: radial-gradient(ellipse 820px 460px at 100% 0%, rgba(49,77,208,.62) 0%, rgba(49,77,208,.2) 42%, rgba(49,77,208,0) 72%); background-repeat: no-repeat; color: #fff; font-family: var(--bi-font); }
.hero-section-3::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 520px; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 64px 64px; background-position: right top; -webkit-mask-image: radial-gradient(ellipse 860px 480px at 100% 0%, #000 0%, rgba(0,0,0,.5) 45%, transparent 75%); mask-image: radial-gradient(ellipse 860px 480px at 100% 0%, #000 0%, rgba(0,0,0,.5) 45%, transparent 75%); }
.hero-section-3 .hero-column { display: block; width: 100%; max-width: 1140px; height: auto; margin: 0 auto; padding: 0 24px; }
.hero-section-3 .hero-column > div { display: block !important; width: 100% !important; max-width: 760px !important; margin: 0 !important; padding: 0; text-align: left !important; }
.hero-section-3 .hero-column > div > div:first-child { display: block !important; width: 100% !important; margin: 0 !important; text-align: left !important; font-size: 16px; }
.hero-section-3 .hero-column > div > div:first-child::before { content: 'Blog'; display: inline-block; margin: 0 0 18px; padding: 7px 12px 6px; border-radius: 4px; background: #314DD0; color: #fff; font-family: var(--bi-font); font-size: 13px; font-weight: 600; line-height: 1.2; letter-spacing: .03em; }
.hero-section-3 .h1 { width: auto; max-width: 100%; margin: 0; padding: 0; color: #fff; font-family: var(--bi-font); font-size: clamp(42px, 4.6vw, 64px); font-weight: 700; line-height: 1.06; letter-spacing: -.034em; text-align: left; }
.hero-section-3 .body-xl.text-center { display: block; width: auto; max-width: 620px; margin: 20px 0 0 !important; color: rgba(255,255,255,.78); font-family: var(--bi-font); font-size: 20px; font-weight: 400; line-height: 1.5; letter-spacing: -.005em; text-align: left; }

/* 2. List area: light grey, 1140px container. The search bar sits across the edge of the hero band. */
#services.div-section { --bi-font: 'Helvetica Neue', Inter, Helvetica, Arial, sans-serif; display: block; padding: 0 0 96px; background: #f5f5f6; font-family: var(--bi-font); }
#services .div-container { display: block; width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 24px; }
#services .search { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; width: 100%; max-width: 620px; margin: -32px 0 56px; padding: 7px 7px 7px 22px; border: 1px solid #e3e3e6; border-radius: 999px; background: #fff; box-shadow: 0 18px 40px -22px rgba(0,0,0,.45); }
#services .search:focus-within { border-color: #314DD0; box-shadow: 0 18px 40px -22px rgba(49,77,208,.6), 0 0 0 3px rgba(49,77,208,.16); }
#services .search-input { flex: 1; min-width: 0; height: 48px; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; outline: 0; color: #000; font-family: var(--bi-font); font-size: 16px; line-height: 1.3; }
#services .search-input::placeholder { color: #666; opacity: 1; }
#services .search .nav-bar-cta { flex: none; min-height: 48px; margin: 0; padding: 0 26px; border: 0; border-radius: 999px; background: #000; box-shadow: none; color: #fff; font-family: var(--bi-font); font-size: 15px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; cursor: pointer; transition: background-color .18s ease; }
#services .search .nav-bar-cta:hover { background: #314DD0; }

/* 3. Post cards: same family as the author page cards */
#services .collection-list-wrapper-2 { width: 100%; }
#services .collection-list-2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 24px; }
#services .collection-item-2 { display: flex; min-width: 0; }
#services .div-block-72 { position: relative; display: flex; flex-direction: column; width: 100%; max-width: none; padding: 0; overflow: hidden; border: 1px solid #e3e3e6; border-radius: 14px; background: #fff; box-shadow: none; filter: none; color: #000; text-decoration: none; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
#services .div-block-72:hover { border-color: #314DD0; box-shadow: 0 14px 34px -18px rgba(49,77,208,.45); transform: translateY(-2px); }
#services .div-block-72:focus-visible, #services .pagination a:focus-visible { outline: 2px solid #314DD0; outline-offset: 3px; }
#services .div-block-72::before { content: ''; position: absolute; top: 0; right: 0; left: 0; aspect-ratio: 1200 / 630; background: #000 radial-gradient(ellipse 80% 120% at 100% 0%, rgba(49,77,208,.62) 0%, rgba(49,77,208,0) 70%) center / cover no-repeat; border-bottom: 1px solid #e3e3e6; }
#services .div-block-72[data-bi-fit]::before { background-image: var(--bi-cover); }
#services .image-45 { position: relative; order: 0; display: block !important; flex: none; width: 100%; max-width: none; height: auto; aspect-ratio: 1200 / 630; margin: 0; border-radius: 0; border-bottom: 1px solid #e3e3e6; object-fit: cover; }
#services .image-45.w-dyn-bind-empty { visibility: hidden; }
#services .div-block-72[data-bi-fit] .image-45 { object-fit: contain; background: rgba(245,245,246,.28); -webkit-backdrop-filter: blur(22px) saturate(1.1); backdrop-filter: blur(22px) saturate(1.1); }
#services .div-block-152 { display: contents; }
#services .div-block-152 > div:last-child { order: 1; margin: 20px 22px 0; }
#services .text-block-87 { color: #314DD0; font-family: var(--bi-font); font-size: 12px; font-weight: 600; line-height: 1.2; letter-spacing: .08em; text-transform: uppercase; }
#services .div-block-72 > .direction-column { order: 2; display: block; margin: 10px 22px 18px; padding: 0; }
#services .div-block-72 .body-md { margin: 0; padding: 0; color: #000; font-family: var(--bi-font); font-size: 20px; font-weight: 700; line-height: 1.25; letter-spacing: -.02em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
#services .div-block-153 { order: 3; display: flex; align-items: center; gap: 10px; min-width: 0; margin: auto 22px 0; padding: 13px 0 16px; border-top: 1px solid #ededf0; }
#services .image-82 { flex: none; width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #e6e6ea; }
#services .text-block-86 { flex: 1; min-width: 0; overflow: hidden; color: #666; font-family: var(--bi-font); font-size: 14px; font-weight: 500; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
#services .div-block-153::after { content: 'Read article →'; flex: none; color: #000; font-family: var(--bi-font); font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
#services .div-block-72:hover .div-block-153::after { color: #314DD0; }

/* 4. Pagination */
#services .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 48px 0 0; }
#services .pagination .nav-bar-cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 132px; min-height: 48px; margin: 0; padding: 0 24px; border: 1.5px solid #000; border-radius: 999px; background: #000; box-shadow: none; color: #fff; font-family: var(--bi-font); font-size: 15px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; text-decoration: none; transition: background-color .18s ease, border-color .18s ease, color .18s ease; }
#services .pagination .w-pagination-previous { background: #fff; color: #000; }
#services .pagination .nav-bar-cta:hover { border-color: #314DD0; background: #314DD0; color: #fff; }
#services .pagination .nav-bar-cta svg { width: 14px; height: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { #services .div-block-72 { transition: none; } #services .div-block-72:hover { transform: none; } }

/* 5. Tablet and phone */
@media (max-width: 991px) {
  .hero-section-3 { padding: 128px 0 100px; }
  #services .collection-list-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #services.div-section { padding-bottom: 80px; }
}
@media (max-width: 599px) {
  .hero-section-3 { padding: 108px 0 84px; background-image: radial-gradient(ellipse 110% 380px at 100% 0%, rgba(49,77,208,.6) 0%, rgba(49,77,208,.16) 46%, rgba(49,77,208,0) 76%); }
  .hero-section-3 .hero-column, #services .div-container { padding: 0 20px; }
  .hero-section-3 .h1 { font-size: clamp(38px, 11vw, 46px); }
  .hero-section-3 .body-xl { font-size: 17px; }
  #services .search { margin: -30px 0 40px; padding-left: 18px; }
  #services .search .nav-bar-cta { padding: 0 20px; }
  #services .collection-list-2 { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  #services .div-block-72 .body-md { font-size: 19px; }
  #services.div-section { padding-bottom: 56px; }
  #services .pagination { margin-top: 36px; }
}
</style>
<script data-blog-index-v2>
/* Covers that are not wide (square and similar) are shown whole on a blurred copy of themselves instead of being cropped. Looks only; no content is changed. */
(function () {
  function fit(img) {
    var card = img.closest ? img.closest('.div-block-72') : null;
    if (!card || !img.naturalWidth || card.hasAttribute('data-bi-fit')) return;
    if (img.naturalWidth / img.naturalHeight < 1.6) { card.style.setProperty('--bi-cover', 'url("' + (img.currentSrc || img.src).replace(/["\\]/g, '') + '")'); card.setAttribute('data-bi-fit', ''); }
  }
  function scan() { var imgs = document.querySelectorAll('.div-block-72 > .image-45'); for (var i = 0; i < imgs.length; i++) if (imgs[i].complete) fit(imgs[i]); }
  document.addEventListener('load', function (e) { var t = e.target; if (t && t.classList && t.classList.contains('image-45')) fit(t); }, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', scan); else scan();
})();
</script>

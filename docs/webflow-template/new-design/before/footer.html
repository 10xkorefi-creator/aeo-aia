<script>
document.addEventListener('DOMContentLoaded', function () {
  var rt = document.querySelector('.blog-text');
  if (!rt) return;

  var headings = rt.querySelectorAll('h2, h3');
  headings.forEach(function (h) {
    if (!/key\s*takeaways/i.test(h.textContent)) return;

    var next = h.nextElementSibling;
    if (!next) return;

    if (next.tagName === 'UL' || next.tagName === 'OL') {
      next.style.listStyleType = next.tagName === 'UL' ? 'disc' : 'decimal';
      next.style.paddingLeft = '24px';
      return;
    }

    if (next.tagName === 'P' && next.innerHTML.indexOf('<br') !== -1) {
      var items = next.innerHTML.split(/<br\s*\/?>/ )
        .map(function (s) { return s.trim(); })
        .filter(Boolean);
      if (items.length > 1) {
        var ul = document.createElement('ul');
        items.forEach(function (txt) {
          var li = document.createElement('li');
          li.innerHTML = txt;
          ul.appendChild(li);
        });
        next.replaceWith(ul);
      }
    }
  });
});
</script>

<script>
window.Webflow ||= [];
window.Webflow.push(function () {
  const richText = document.querySelector('.blog-text');
  const tocContainer = document.getElementById('toc');
  if (!richText || !tocContainer) return;

  const headers = richText.querySelectorAll('h2');
  const links = [];
  const slugSet = new Set();

  const slugify = (text) => {
    let slug = text
      .toLowerCase()
      .trim()
      .replace(/[\s]+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-');

    let uniqueSlug = slug;
    let count = 1;
    while (slugSet.has(uniqueSlug)) {
      uniqueSlug = `${slug}-${count++}`;
    }
    slugSet.add(uniqueSlug);
    return uniqueSlug;
  };

  headers.forEach(header => {
    const id = slugify(header.innerText);
    header.setAttribute('id', id);

    const link = document.createElement('a');
    link.href = `#${id}`;
    link.innerText = header.innerText;
    link.className = 'toc-link';
    tocContainer.appendChild(link);
    links.push({ id, link, header });
  });

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.getAttribute('id');
        links.forEach(obj => {
          obj.link.classList.toggle('active', obj.id === id);
        });
      }
    });
  }, {
    rootMargin: '0px 0px -70% 0px',
    threshold: 0
  });

  headers.forEach(header => observer.observe(header));
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var content = document.querySelector('.blog-content') || document.querySelector('.w-richtext');
  if (!content) return;
  if (document.querySelector('script[data-faq-schema]')) return;

  var faqs = [];
  var headings = content.querySelectorAll('h2, h3');

  headings.forEach(function(heading) {
    var questionText = heading.textContent.trim();
    var isQuestion = questionText.endsWith('?') || /^(what|how|why|when|where|who|can|does|is|are|should|will|do)/i.test(questionText);

    if (isQuestion) {
      var answer = '';
      var nextEl = heading.nextElementSibling;

      while (nextEl && !['H2', 'H3'].includes(nextEl.tagName)) {
        if (nextEl.textContent.trim()) {
          answer += nextEl.textContent.trim() + ' ';
        }
        nextEl = nextEl.nextElementSibling;
      }

      if (answer.trim()) {
        faqs.push({
          "@type": "Question",
          "name": questionText,
          "acceptedAnswer": {
            "@type": "Answer",
            "text": answer.trim().substring(0, 500)
          }
        });
      }
    }
  });

  if (faqs.length > 0) {
    var faqSchema = {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": faqs.slice(0, 10)
    };

    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify(faqSchema);
    document.head.appendChild(script);
  }
});
</script>

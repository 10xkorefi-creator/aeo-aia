    sec.appendChild(inner); hero.insertAdjacentElement('afterend', sec);

    feed.then(function (data) {
      var posts = data && Array.isArray(data.posts) ? data.posts.filter(function (p) { return p && p.slug && p.name; }) : [];
      if (!posts.length) { list.remove(); return; }
      var shown = 0, more = null, note = null;
      count.textContent = posts.length + (posts.length === 1 ? ' article' : ' articles');
      grid.textContent = ''; grid.removeAttribute('aria-busy');
      function add() {
        var end = Math.min(shown + STEP, posts.length);
        for (; shown < end; shown++) grid.appendChild(card(posts[shown]));
        if (more) { if (shown >= posts.length) more.remove(); else note.textContent = 'Showing ' + shown + ' of ' + posts.length; }
      }
      if (posts.length > STEP) {
        more = el('div', 'aia-au-more'); var btn = el('button', '', 'Show more'); btn.type = 'button'; note = el('span', '');
        btn.addEventListener('click', add); more.appendChild(btn); more.appendChild(note); list.appendChild(more);
      }
      add();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
})();
</script>
